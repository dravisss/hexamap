[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hexmap-studio"
version = "10.3.0"
description = "Local-first Markdown/YAML hexagonal mapping toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ravi Resck"}]
keywords = ["knowledge-mapping", "hexmap", "markdown", "yaml", "local-first", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["jsonschema>=4.18,<5", "PyYAML>=6.0,<7"]

[project.urls]
Homepage = "https://github.com/dravisss/hexamap"
Repository = "https://github.com/dravisss/hexamap"
Documentation = "https://github.com/dravisss/hexamap#readme"
Issues = "https://github.com/dravisss/hexamap/issues"
Changelog = "https://github.com/dravisss/hexamap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
visual = ["playwright>=1.40"]

[project.scripts]
hexmap = "hexmap_cli:main"
hexmap-mcp = "hexmap_mcp:main"

[tool.setuptools]
py-modules = ["hexmap_cli", "hexmap_platform", "hexmap_mcp", "hexmap_export", "server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["migrations*"]
namespaces = true

[tool.setuptools.package-data]
"migrations" = ["*.py", "*.json", "*.md", "*.yaml"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*", ".DS_Store"]

[tool.setuptools.data-files]
"share/hexmap-studio/schemas" = ["schemas/*.json"]
"share/hexmap-studio/web" = ["preview-inline.html"]
"share/hexmap-studio" = ["LICENSE", "README.md", "CHANGELOG.md", "SECURITY.md"]
"share/hexmap-studio/docs" = ["docs/*.md"]
"share/hexmap-studio/contracts" = ["contracts/*.md"]
"share/hexmap-studio/examples" = ["examples/*.json", "examples/*.md", "examples/*.yaml"]
"share/hexmap-studio/skills/build-hexmap" = ["skills/build-hexmap/SKILL.md"]
"share/hexmap-studio/skills/build-hexmap/references" = ["skills/build-hexmap/references/*.md"]
"share/hexmap-studio/skills/build-hexmap/scripts" = ["skills/build-hexmap/scripts/*.py"]
"share/hexmap-studio/skills/compose-hexmap" = ["skills/compose-hexmap/SKILL.md"]
"share/hexmap-studio/skills/compose-hexmap/references" = ["skills/compose-hexmap/references/*.md"]
"share/hexmap-studio/skills/compose-hexmap/scripts" = ["skills/compose-hexmap/scripts/*.py"]
"share/hexmap-studio/skills/audit-hexmap" = ["skills/audit-hexmap/SKILL.md"]
"share/hexmap-studio/skills/audit-hexmap/references" = ["skills/audit-hexmap/references/*.md"]
"share/hexmap-studio/skills/audit-hexmap/scripts" = ["skills/audit-hexmap/scripts/*.py"]
"share/hexmap-studio/skills/orchestrate-hexmap" = ["skills/orchestrate-hexmap/SKILL.md"]
"share/hexmap-studio/skills/orchestrate-hexmap/references" = ["skills/orchestrate-hexmap/references/*.md"]
"share/hexmap-studio/skills/orchestrate-hexmap/scripts" = ["skills/orchestrate-hexmap/scripts/*.py"]
