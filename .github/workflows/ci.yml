name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install runtime dependencies
        run: python -m pip install .
      - name: JavaScript tests
        run: npm test
      - name: Python tests
        run: python -m unittest tests/test_platform.py tests/test_release_security.py -v
      - name: Syntax and package checks
        shell: bash
        run: |
          python -m compileall -q hexmap_cli.py hexmap_platform.py hexmap_mcp.py server.py scripts
          if [ -f hexmap_export.py ]; then python -m py_compile hexmap_export.py; fi

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install audit tools and runtime
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install .
      - name: Audit Python dependencies
        run: pip-audit --strict --desc=off .
      - name: Audit Node metadata
        run: npm audit --package-lock=false --omit=dev --audit-level=high

  build:
    name: Reproducible artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build frontend
        run: python build_inline.py
      - name: Build package artifacts
        run: |
          python -m pip install build
          python scripts/build_release.py --output-dir dist --clean
          python scripts/check_release.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: hexmap-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
