name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and verify only
        run: |
          python -m pip install --upgrade pip build
          python build_inline.py
          python scripts/build_release.py --output-dir dist --clean
          python scripts/check_release.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: hexmap-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      # Deliberately no PyPI/GitHub publish step: publication requires a
      # human review of the checksums and a separately authorized action.
